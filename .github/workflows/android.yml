name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Build with Gradle
        run: ./gradlew build${{ inputs.build_type == 'release' && 'Release' || 'Debug' }}
      
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v3
        with:
          name: apk-${{ inputs.build_type }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
      
      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: build-reports-${{ inputs.build_type }}
          path: app/build/reports/
          retention-days: 7
